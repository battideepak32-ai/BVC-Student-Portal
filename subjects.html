<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subjects - BVC</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f6fa;
            min-height: 100vh;
            padding: 40px;
        }

        .subjects-container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        h1 {
            color: #0878b8;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .subject {
            background: #f2f6fa;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 5px solid #0878b8;
        }

        .subject h3 {
            margin-bottom: 5px;
            color: #333;
        }

        .subject p {
            margin: 0;
            color: #666;
        }

        .back-button {
            margin-top: 15px;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #0878b8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-button:hover {
            background: #055d8e;
        }

    </style>

</head>

<body>

    <div class="subjects-container">

        <h1>📚 Subjects</h1>

        <p class="subtitle">
            Your current semester subjects
        </p>


        <div class="subject">
            <h3>1. Advanced Java</h3>
            <p>Subject Code: ADJ101</p>
        </div>


        <div class="subject">
            <h3>2. Open Electrode</h3>
            <p>Subject Code: OEL101</p>
        </div>


        <div class="subject">
            <h3>3. Data Warehouse and Data Mining</h3>
            <p>Subject Code: DWDM102</p>
        </div>


        <div class="subject">
            <h3>4. Automata theory and Compiler Design</h3>
            <p>Subject Code: ATCD101</p>
        </div>


        <div class="subject">
            <h3>5. Computer Networks</h3>
            <p>Subject Code: CN101</p>
        </div>


        <button
            class="back-button"
            onclick="window.location.href='dashboard.html'">

            ← Back to Dashboard

        </button>

    </div>

</body>

</html>
