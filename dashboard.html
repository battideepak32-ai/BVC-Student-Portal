```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BVC Student Portal | Dashboard</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .dashboard {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 30px 24px;
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            padding: 28px;
            background: linear-gradient(135deg, #071b49, #123d83);
            color: white;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(7, 27, 73, 0.15);
        }

        .college-brand {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .college-brand img {
            width: 78px;
            height: 78px;
            object-fit: contain;
            background: white;
            padding: 6px;
            border-radius: 14px;
        }

        .college-brand h1 {
            margin: 0 0 9px;
            font-size: 26px;
            line-height: 1.3;
        }

        .college-brand p {
            margin: 0;
            color: #dbeafe;
            font-size: 14px;
        }

        .student-info {
            min-width: 150px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
        }

        .student-info strong {
            display: block;
            margin-bottom: 7px;
            font-size: 15px;
        }

        .student-info small {
            color: #dbeafe;
            overflow-wrap: anywhere;
        }

        .section-heading {
            margin: 32px 0 8px;
            color: #102b59;
            font-size: 23px;
        }

        .section-description {
            margin: 0 0 22px;
            color: #64748b;
            font-size: 14px;
        }

        .dashboard-menu {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .dashboard-menu button {
            min-height: 145px;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            gap: 12px;
            background: white;
            color: #102b59;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
            transition: transform 0.2s, box-shadow 0.2s,
                        border-color 0.2s;
        }

        .dashboard-menu button:hover {
            transform: translateY(-4px);
            border-color: #93b4ed;
            box-shadow: 0 10px 22px rgba(15, 42, 90, 0.1);
        }

        .menu-icon {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            background: #eaf1ff;
            border-radius: 12px;
            font-size: 25px;
        }

        .menu-description {
            color: #64748b;
            font-size: 12px;
            font-weight: 400;
            line-height: 1.5;
        }

        .dashboard-menu .logout-btn {
            background: #fff;
            color: #b42318;
        }

        .dashboard-menu .logout-btn .menu-icon {
            background: #fff0ee;
        }

        .dashboard-footer {
            margin-top: 30px;
            padding: 18px 10px;
            color: #64748b;
            border-top: 1px solid #dbe3ee;
            text-align: center;
            font-size: 13px;
        }

        @media (max-width: 800px) {
            .dashboard-menu {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .dashboard-header {
                padding: 22px;
            }

            .college-brand h1 {
                font-size: 22px;
            }
        }

        @media (max-width: 520px) {
            .dashboard {
                padding: 15px;
            }

            .dashboard-header {
                padding: 18px;
                align-items: flex-start;
            }

            .college-brand {
                gap: 12px;
                align-items: center;
            }

            .college-brand img {
                width: 58px;
                height: 58px;
            }

            .college-brand h1 {
                font-size: 18px;
            }

            .college-brand p {
                font-size: 12px;
                line-height: 1.5;
            }

            .student-info {
                width: 100%;
            }

            .section-heading {
                font-size: 21px;
                margin-top: 25px;
            }

            .dashboard-menu {
                grid-template-columns: 1fr;
                gap: 13px;
            }

            .dashboard-menu button {
                min-height: 110px;
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <main class="dashboard">

        <header class="dashboard-header">
            <div class="college-brand">
                <img
                    src="images/college-logo.png"
                    alt="BVC College Logo"
                >

                <div>
                    <h1>BVC Student Dashboard</h1>
                    <p>Welcome to BVC Student Portal</p>
                </div>
            </div>

            <div class="student-info">
                <strong>👨‍🎓 Student Account</strong>
                <small>
                    Student ID:
                    <span id="studentId">Loading...</span>
                </small>
            </div>
        </header>

        <h2 class="section-heading">Student Services</h2>
        <p class="section-description">
            Access your academic information and student services.
        </p>

        <nav class="dashboard-menu">

            <button type="button"
                onclick="window.location.href='profile.html'">
                <span class="menu-icon">👤</span>
                <span>Student Profile</span>
                <span class="menu-description">
                    View and manage your profile
                </span>
            </button>

            <button type="button"
                onclick="window.location.href='subjects.html'">
                <span class="menu-icon">📚</span>
                <span>Subjects</span>
                <span class="menu-description">
                    View your enrolled subjects
                </span>
            </button>

            <button type="button"
                onclick="window.location.href='Attendance.html'">
                <span class="menu-icon">📊</span>
                <span>Attendance</span>
                <span class="menu-description">
                    Check attendance information
                </span>
            </button>

            <button type="button"
                onclick="window.location.href='results.html'">
                <span class="menu-icon">📝</span>
                <span>Results</span>
                <span class="menu-description">
                    View marks and grades
                </span>
            </button>

            <button type="button"
                onclick="window.location.href='timetable.html'">
                <span class="menu-icon">📅</span>
                <span>Timetable</span>
                <span class="menu-description">
                    Check your weekly class schedule
                </span>
            </button>

            <button type="button" class="logout-btn"
                onclick="logout()">
                <span class="menu-icon">🚪</span>
                <span>Logout</span>
                <span class="menu-description">
                    Return to the student login page
                </span>
            </button>

        </nav>

        <footer class="dashboard-footer">
            © BVC Engineering College | Student Portal
        </footer>

    </main>

    <script src="script.js"></script>

    <script>
        const savedStudentId = localStorage.getItem("studentId");

        document.getElementById("studentId").textContent =
            savedStudentId || "Not available";
    </script>

</body>
</html>
```
